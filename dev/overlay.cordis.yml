# Development overlay for `pnpm dsh web --patch` from the dsh source tree (see dev/README.md). A `--patch` overlay does not
# apply the package's own cordis.patch.yml, so this file repeats its rows; keep the two in step. The plugin row names the
# built host entry by absolute path (the loader needs one here) and supplies the development data directory.
- insert:
    - id: outpost
      name: /Users/tiger/Projects/AgentOutpost/lib/index.js
      config:
        dataDir: /Users/tiger/Projects/AgentOutpost-data/dev
    - id: outpost-researcher-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: outpost-researcher
        name: 前哨调研员
        description: 前哨的调研会话专用，不供手动选择。只能联网搜索和读网页，没有命令行和文件工具。
        order: 92
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a product research analyst powered by the {{model}} model.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: outpost-browser-use
      name: '@deepseek-ai/dsh-browser-use'
      disabled: true
    - id: outpost-browser-use-playwright
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      disabled: true
      config:
        mode: launch
        headless: true
