# dsh-outpost bundle layer: the plugin itself, and the agent preset its research sessions run under, which carries the
# browser fallback that opens pages plain fetching cannot read. The `outpost` row carries no dataDir: the profile supplies
# it, and the plugin refuses to start without it. dev/overlay.cordis.yml repeats these rows for a development run, because a
# `--patch` overlay does not apply this file; keep the two in step (tests/build.spec.ts compares the preset rows).
- insert:
    - id: outpost
      name: dsh-outpost
    # The preset of every research session (outpost-researcher). It reads the web and nothing else: no shell, no file tools,
    # no subagents. A preset row cannot hide itself from the preset picker, so its name and description say whom it is for.
    - id: outpost-researcher-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: outpost-researcher
        name: 前哨调研员
        description: 前哨的调研会话专用，不供手动选择。只能联网搜索和读网页，没有命令行和文件工具。
        order: 92
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a product research analyst powered by the {{model}} model.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # Browser fallback, on (the user's choice, 2026-11-26): a page plain fetching cannot read (WeChat articles,
          # Xiaohongshu, Zhihu) is opened in a headless Chrome. It lives in this preset, so only research sessions get it,
          # never a session of the user's own; the browser-use service is isolated to the group, as DSH requires of a
          # service inside a preset. What it costs:
          # - Every research session gets the `mcp__playwright-mcp__*` tools, `browser_run_code_unsafe` among them
          #   (arbitrary JavaScript in the Playwright process, by Playwright's own description), and they run without
          #   approval, while the session reads pages nobody vetted.
          # - Every live research session runs a Playwright MCP server (about 125 MB), and one that opened a page a headless
          #   Chrome (0.7 GB on a blank page, more on real ones). Outpost ends a research session's live agent when its run
          #   is over, which closes both, so only the sessions running now hold one; a research session opened later in DSH
          #   starts its server again, until DSH restarts.
          # Both packages must be installed in the profile (`dsh plugin add @deepseek-ai/dsh-browser-use
          # @deepseek-ai/dsh-experimental-browser-use-playwright-mcp`): without them this preset fails and no research runs.
          # Do not also turn on a Playwright provider for the whole profile: research sessions then fail to start
          # ("serverName "playwright-mcp" is already in use"). executablePath is this machine's Chrome; elsewhere, point it
          # at a Chromium-based browser, or drop the line to let Playwright find one. To change it, or to turn the fallback
          # off, override the `outpost-researcher-preset` row in the profile's cordis.patch.yml: an override replaces the
          # whole `config`, so restate it from this file with the line changed, or without the `browser` group. Off, a
          # finding whose source will not open stays 「待确认」.
          - id: browser
            name: cordis:group
            group: true
            isolate:
              browserUse: true
            config:
              - id: browser-use
                name: '@deepseek-ai/dsh-browser-use'
              - id: browser-use-playwright
                name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
                config:
                  mode: launch
                  headless: true
                  executablePath: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
