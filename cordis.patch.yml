# dsh-outpost bundle layer: the plugin itself, and the agent preset its research sessions run under without the browser
# fallback. The one with it (pages plain fetching cannot read are opened in a headless Chrome) Outpost registers itself
# when the browser packages are installed (src/host/browser-preset.ts). The `outpost` row carries no configuration: without a dataDir in the profile, Outpost keeps its data in
# ~/.outpost/data (the directory install.sh writes there too). dev/overlay.cordis.yml repeats these rows for a development
# run, because a `--patch` overlay does not apply this file; keep the two in step (tests/build.spec.ts compares the preset
# rows).
- insert:
    - id: outpost
      name: dsh-outpost
    # The research preset with the browser fallback (outpost-researcher) is not a row here: Outpost registers it itself,
    # only when the browser packages are installed in the profile (src/host/browser-preset.ts, M2.4), so that a plain
    # `dsh plugin add` does not show it failing to load among DSH's presets.
    # The research preset without the browser (outpost-researcher-basic), for research sessions when the one with it is
    # not registered (no browser packages) or clashes with a Playwright browser of the whole profile: src/host/dsh-sessions.ts
    # picks between the two before each new research session. Keep its plugins those of src/host/browser-preset.ts, less
    # the `browser` group (tests/build.spec.ts checks). It shows in the preset picker, so it says whom it is for.
    - id: outpost-researcher-basic-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: outpost-researcher-basic
        name: 前哨调研员（无浏览器）
        description: 前哨的调研会话专用，带浏览器的调研预设用不了时才用，不供手动选择。只能联网搜索和读网页，没有命令行和文件工具，本身也不带浏览器。
        order: 93
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a product research analyst powered by the {{model}} model.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
